<svg xmlns="http://www.w3.org/2000/svg" width="980" height="250" viewBox="0 0 980 250" role="img" aria-labelledby="title desc">
  <title id="title">LangGraphLLMClient async completion graph</title>
  <desc id="desc">Asynchronous LLM completion graph from START to acomplete node to END.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="980" height="250" fill="#f8fafc"/>
  <text x="40" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a">LangGraphLLMClient - async graph</text>
  <text x="40" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">State: system, user, response_schema, max_output_tokens, response</text>

  <g filter="url(#shadow)">
    <rect x="55" y="112" width="110" height="64" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="110" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">START</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="280" y="92" width="270" height="104" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="415" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#4c1d95">acomplete</text>
    <text x="415" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b21b6">await delegate.acomplete(...)</text>
    <text x="415" y="173" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5b21b6">passes schema and token limit</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="665" y="92" width="240" height="104" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="785" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#14532d">response</text>
    <text x="785" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#166534">state[&quot;response&quot;]</text>
    <text x="785" y="173" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#166534">returned to caller</text>
  </g>

  <line x1="165" y1="144" x2="268" y2="144" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="144" x2="653" y2="144" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="936" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">END</text>
  <line x1="905" y1="144" x2="930" y2="144" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
