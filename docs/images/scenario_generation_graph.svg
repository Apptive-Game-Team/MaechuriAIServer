<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc">
  <title id="title">ScenarioGenerationGraph workflow</title>
  <desc id="desc">LangGraph scenario generation flow from START to END through generate_case, generate_expansion, and generate_content nodes.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1120" height="260" fill="#f8fafc"/>
  <text x="40" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a">ScenarioGenerationGraph</text>
  <text x="40" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569">State: pre_input, request_id, case_state, expansion_result, final_scenario</text>

  <g filter="url(#shadow)">
    <rect x="40" y="112" width="110" height="64" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="95" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">START</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="210" y="100" width="190" height="88" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="305" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">generate_case</text>
    <text x="305" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1e40af">case_state cache</text>
    <text x="305" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1e40af">ScenarioGenerator.generate_case</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="100" width="210" height="88" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="575" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#14532d">generate_expansion</text>
    <text x="575" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#166534">skeleton + expansion</text>
    <text x="575" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#166534">critic/refinement loop</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="750" y="100" width="210" height="88" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="855" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#78350f">generate_content</text>
    <text x="855" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#92400e">map, suspects, clues</text>
    <text x="855" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#92400e">clearability retry loop</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="112" width="70" height="64" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="1045" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">END</text>
  </g>

  <line x1="150" y1="144" x2="198" y2="144" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="144" x2="458" y2="144" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="680" y1="144" x2="738" y2="144" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="960" y1="144" x2="998" y2="144" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
